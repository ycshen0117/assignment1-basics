[project]
name = "cs336_basics"
version = "1.0.6"
description = "CS336 Assignment 1"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "einops>=0.8.1", # tensor operations
    "einx>=0.3.0", # more general tensor operations
    "jaxtyping>=0.3.0", # type hints for pytorch/jax/numpy
    "numpy",
    "psutil>=6.1.1",
    "pytest>=8.3.4",
    "regex>=2024.11.6", # more powerful regex than the builtin `re` module
    "submitit>=1.5.2", # job submission for SLURM
    "tiktoken>=0.9.0",
    "torch~=2.6.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "torch~=2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'", # Intel Macs
    "tqdm>=4.67.1",
    "wandb>=0.24.1",
    "ty>=0.0.1a16",
    "tokenizers>=0.22.2",
    "absl-py>=2.4.0",
    "antlr4-python3-runtime>=4.9.3",
    "certifi>=2026.1.4",
    "charset-normalizer>=3.4.4",
    "click>=8.3.1",
    "gitpython>=3.1.46",
    "grpcio>=1.76.0",
    "hydra-core>=1.3.2",
    "idna>=3.11",
    "markdown>=3.10.1",
    "markdown-it-py>=4.0.0",
    "mdurl>=0.1.2",
    "numpy>=2.4.1",
    "nvidia-ml-py>=13.590.48",
    "omegaconf>=2.3.0",
    "packaging>=26.0",
    "pandas>=3.0.0",
    "pillow>=12.1.0",
    "platformdirs>=4.5.1",
    "prettytable>=3.17.0",
    "pydantic>=2.12.5",
    "pydantic-core>=2.41.5",
    "pyecharts>=2.0.9",
    "python-dateutil>=2.9.0.post0",
    "pyyaml>=6.0.3",
    "rich>=13.9.4",
    "setuptools>=80.10.2",
    "simplejson>=3.20.2",
    "six>=1.17.0",
    "swanlab>=0.7.6",
    "tensorboard>=2.20.0",
    "tensorboard-data-server>=0.7.2",
    "typing-inspection>=0.4.2",
    "urllib3>=2.6.3",
    "wcwidth>=0.5.3",
    "werkzeug>=3.1.5",
    "wrapt>=2.1.0",
]

[build-system]
requires = ["uv_build>=0.8.3,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cs336_basics"
module-root = ""

[tool.uv]
package = true
python-preference = "managed"

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "WARNING"
addopts = "-s"

[tool.ruff]
line-length = 120

[tool.ruff.lint.extend-per-file-ignores]
# Also ignore `E402` in all `__init__.py` files.
"__init__.py" = ["E402", "F401", "F403", "E501"]

[tool.ruff.lint]
extend-select = ["UP"]
ignore = [
    "F722"
]
